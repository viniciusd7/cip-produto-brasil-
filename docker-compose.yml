services:
  mysql:
    image: mysql:8.4
    container_name: cip-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cip_gestao
      MYSQL_USER: cip
      MYSQL_PASSWORD: cip_secret
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucip", "-pcip_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cip-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://cip:cip_secret@mysql:3306/cip_gestao
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      NEXTAUTH_SECRET: troque-por-um-secret-longo-e-aleatorio
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cip-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: troque-por-um-secret-longo-e-aleatorio
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
